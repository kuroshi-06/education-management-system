{% extends 'base.html' %}
{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
    <div class="theme-surface border theme-border rounded-[40px] p-10 lg:p-14 shadow-2xl shadow-indigo-100 max-w-xl w-full relative overflow-hidden">
        <!-- Decorative Background Glow -->
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-pink-100 rounded-full blur-3xl opacity-40"></div>

        <div class="text-center mb-10 relative z-10">
            <div class="w-20 h-20 theme-btn rounded-[28px] flex items-center justify-center text-4xl mx-auto mb-6 shadow-xl shadow-indigo-200">
                🚀
            </div>
            <h2 class="text-3xl font-extrabold theme-text tracking-tight">Join EduWay</h2>
            <p class="theme-muted mt-2 font-medium">Start your learning and earn points</p>
        </div>
        
        <form method="POST" enctype="multipart/form-data" class="space-y-5 relative z-10">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="space-y-1">
                    <label class="text-[11px] font-black theme-muted uppercase tracking-widest ml-2">Username</label>
                    <input type="text" name="username" placeholder="delacruz_101" 
                           class="w-full p-4 rounded-2xl border theme-border bg-slate-50/50 theme-text focus:ring-4 focus:ring-violet-100 outline-none transition shadow-sm" required>
                </div>
                <div class="space-y-1">
                    <label class="text-[11px] font-black theme-muted uppercase tracking-widest ml-2">Full Name</label>
                    <input type="text" name="full_name" placeholder="Juan Dela Cruz" 
                           class="w-full p-4 rounded-2xl border theme-border bg-slate-50/50 theme-text focus:ring-4 focus:ring-violet-100 outline-none transition shadow-sm" required>
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-[11px] font-black theme-muted uppercase tracking-widest ml-2">Program</label>
                <input type="text" name="bio" placeholder="Computer Science" 
                       class="w-full p-4 rounded-2xl border theme-border bg-slate-50/50 theme-text focus:ring-4 focus:ring-violet-100 outline-none transition shadow-sm">
            </div>

            <div class="space-y-1">
                <label class="text-[11px] font-black theme-muted uppercase tracking-widest ml-2">Profile Picture</label>
                <div class="relative group">
                    <input type="file" name="profile_pic" accept="image/*" 
                           class="w-full p-3 rounded-2xl border-2 border-dashed theme-border bg-slate-50/50 theme-text text-xs file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:theme-btn cursor-pointer transition hover:bg-slate-100">
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-[11px] font-black theme-muted uppercase tracking-widest ml-2">Password</label>
                <input type="password" name="password" placeholder="Create a secure password" 
                       class="w-full p-4 rounded-2xl border theme-border bg-slate-50/50 theme-text focus:ring-4 focus:ring-violet-100 outline-none transition shadow-sm" required>
            </div>

            <button type="submit" class="theme-btn w-full py-4 rounded-[22px] font-bold text-lg shadow-xl shadow-indigo-100 hover:scale-[1.01] active:scale-95 transition mt-4">
                Create Account
            </button>
        </form>
        
        <div class="text-center mt-10 relative z-10">
            <p class="text-sm theme-muted font-medium">
                Already have an account? 
                <a href="/login" class="theme-text-primary font-bold hover:underline">Sign In</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
