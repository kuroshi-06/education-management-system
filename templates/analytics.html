{% extends 'base.html' %}
{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <div class="lg:col-span-2 theme-surface border theme-border rounded-[40px] p-10 shadow-sm">
        <h2 class="text-2xl font-extrabold theme-text mb-6">Learning Analytics</h2>
        
        <div class="space-y-8">
            <div>
                <div class="flex justify-between text-sm font-bold mb-2">
                    <span class="theme-text">Average Quiz Accuracy</span>
                    <span class="theme-text-primary">{{ avg_score|round|int }}%</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-3">
                    <div class="theme-btn h-3 rounded-full" style="width: {{ avg_score }}%"></div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-6">
                <div class="p-6 bg-slate-50 rounded-3xl border theme-border">
                    <div class="text-xs font-bold theme-muted uppercase">Total XP Gained</div>
                    <div class="text-2xl font-black theme-text-primary">{{ current_user.points }}</div>
                </div>
                <div class="p-6 bg-slate-50 rounded-3xl border theme-border">
                    <div class="text-xs font-bold theme-muted uppercase">Overall Standing</div>
                    <div class="text-2xl font-black theme-text">Top 5%</div>
                </div>
            </div>
        </div>
    </div>

    <div class="theme-surface border theme-border rounded-[40px] p-8 shadow-sm">
        <h3 class="font-bold theme-text mb-4 text-center">Consistency</h3>
        <!-- Simple CSS representation of a streak -->
        <div class="flex justify-center gap-2">
            {% for i in range(7) %}
            <div class="w-8 h-12 rounded-lg {% if i < 4 %}theme-btn{% else %}bg-slate-100{% endif %}"></div>
            {% endfor %}
        </div>
        <p class="text-center theme-muted text-xs mt-4 font-bold uppercase tracking-widest">4 Day Streak</p>
    </div>
</div>
{% endblock %}
